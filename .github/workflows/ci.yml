name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew help --warning-mode=all build -x koverVerify
      - name: Testes e análise estática
        run: >-
          ./gradlew test :app:integrationTest :app:e2eTest
          detekt ktlintCheck koverHtmlReport
      - name: Smoke do ambiente Compose
        run: bash scripts/smoke-e2e.sh
      - name: Bloqueio de cobertura
        run: ./gradlew koverVerify
      - name: Guardar relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-kover
          path: "**/build/reports/kover/"
          if-no-files-found: ignore

  load:
    name: Carga Gatling
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Executar carga de referência
        run: ./gradlew :app:loadTest -PloadRequests=1000
      - name: Guardar relatórios de carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-gatling
          path: |
            app/build/reports/load/
            app/build/reports/gatling/
          if-no-files-found: ignore
