services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: notafiscal
      POSTGRES_USER: notafiscal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD no .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-replica/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notafiscal -d notafiscal"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  postgres-replica:
    image: postgres:17.6
    profiles: [replica]
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD no .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD no .env}
    entrypoint: ["bash", "-ec"]
    command:
      - |
        until pg_isready -h postgres -U notafiscal -d notafiscal; do sleep 1; done
        rm -rf "$${PGDATA:?}"/*
        pg_basebackup -h postgres -D "$${PGDATA}" -U replicator -Fp -Xs -P -R
        exec /usr/local/bin/docker-entrypoint.sh postgres
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notafiscal -d notafiscal && test -f \"$${PGDATA}/standby.signal\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  kafka:
    image: apache/kafka:4.0.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_RUNTIME_ROLE: api
      APP_DB_WRITE_POOL_SIZE: ${API_DB_WRITE_POOL_SIZE:-25}
      APP_DB_READ_POOL_SIZE: ${API_DB_READ_POOL_SIZE:-25}
      APP_DB_WRITE_POOL_NAME: notafiscal-api-write
      APP_DB_READ_POOL_NAME: notafiscal-api-read
      APP_DB_WRITE_CONNECTION_TIMEOUT: ${API_DB_WRITE_CONNECTION_TIMEOUT:-10s}
      NOTA_FISCAL_INGRESSO_CAPACIDADE: ${NOTA_FISCAL_INGRESSO_CAPACIDADE:-1000}
      NOTA_FISCAL_INGRESSO_ESPERA_MAXIMA: ${NOTA_FISCAL_INGRESSO_ESPERA_MAXIMA:-8s}
      NOTA_FISCAL_INGRESSO_LOTE_MAXIMO: ${NOTA_FISCAL_INGRESSO_LOTE_MAXIMO:-100}
      NOTA_FISCAL_INGRESSO_ESCRITORES: ${NOTA_FISCAL_INGRESSO_ESCRITORES:-2}
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-8192}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-100}
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      DB_WRITE_URL: jdbc:postgresql://postgres:5432/notafiscal?currentSchema=notafiscal
      DB_READ_URL: ${DB_READ_URL:-jdbc:postgresql://postgres:5432/notafiscal?currentSchema=notafiscal}
      DB_USER: notafiscal
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_RUNTIME_ROLE: worker
      # O worker não atende rotas de negócio: o servlet existe só para expor o actuator
      # (health e métricas Prometheus) na porta de gerenciamento.
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      SERVER_PORT: "0"
      MANAGEMENT_SERVER_PORT: "8081"
      APP_DB_WRITE_POOL_SIZE: ${WORKER_DB_WRITE_POOL_SIZE:-5}
      APP_DB_READ_POOL_SIZE: ${WORKER_DB_READ_POOL_SIZE:-10}
      APP_DB_WRITE_POOL_NAME: notafiscal-worker-write
      APP_DB_READ_POOL_NAME: notafiscal-worker-read
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      DB_WRITE_URL: jdbc:postgresql://postgres:5432/notafiscal?currentSchema=notafiscal
      DB_READ_URL: ${DB_READ_URL:-jdbc:postgresql://postgres:5432/notafiscal?currentSchema=notafiscal}
      DB_USER: notafiscal
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${LOCAL_CONSUMER_CONCURRENCY:-10}
      NOTA_FISCAL_CONSUMIDORES_ESTOQUE_MAX_EM_VOO: ${LOCAL_CONSUMER_CONCURRENCY:-10}
      NOTA_FISCAL_CONSUMIDORES_REGISTRO_MAX_EM_VOO: ${LOCAL_CONSUMER_CONCURRENCY:-10}
      NOTA_FISCAL_CONSUMIDORES_ENTREGA_MAX_EM_VOO: ${LOCAL_CONSUMER_CONCURRENCY:-10}
      NOTA_FISCAL_CONSUMIDORES_FINANCEIRO_MAX_EM_VOO: ${LOCAL_CONSUMER_CONCURRENCY:-10}
    ports:
      - "8082:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  observabilidade:
    image: grafana/otel-lgtm:0.11.0
    profiles: [observabilidade]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres-data:
