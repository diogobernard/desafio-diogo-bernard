# Contextos em cache não são pausados: no JDK 21, religar os consumidores Kafka de um contexto
# pausado pode travar a JVM de teste (AppInfoParser + appender do Logback com virtual threads).
# Como os contextos continuam consumindo do mesmo Kafka, todo contexto com consumidores e
# configuração própria deve usar tópicos exclusivos (nota-fiscal.kafka.topico-*).
spring.test.context.cache.pause=never
